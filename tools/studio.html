<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio · KHOTWA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 52% 44%, #fffdf9 0%, #f7efe5 42%, #eee2d4 78%, #e9ddce 100%);
    }
    body::before {
      content: "";
      position: fixed;
      width: 56%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, .42);
      filter: blur(70px);
      transform: translateY(-4%);
    }
    #stage { width: 100vmin; height: 100vmin; max-width: 100vw; max-height: 100vh; position: relative; }
    canvas { display: block; width: 100% !important; height: 100% !important; position: relative; z-index: 1; }
    #error {
      position: fixed; inset: auto 24px 24px 24px; z-index: 2;
      padding: 14px 18px; border-radius: 12px; background: #fff;
      color: #a33e1f; font: 14px/1.5 system-ui, sans-serif; display: none;
      box-shadow: 0 8px 30px rgba(45, 30, 20, .12); white-space: pre-wrap;
    }
    #error.show { display: block; }
  </style>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <pre id="error"></pre>
  <script type="module" src="/src/three/studio.js"></script>
</body>
</html>
